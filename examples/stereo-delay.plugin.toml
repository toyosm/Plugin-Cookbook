# Stereo delay with filtered, saturated feedback and optional ping-pong.
# Demonstrates: long buffers sized from the sample rate, slow smoothing on delay time (tape-like glide),
# keeping a feedback loop stable with saturation.

[plugin]
id          = "stereo-delay"
name        = "Stereo Delay"
brand       = "Plugin Cookbook"
brand_id    = "Ckbk"
unique_id   = "StDl"
version     = "1.0.0"
description = "Stereo echo with darkening repeats and ping-pong mode."
license     = "MIT"
category    = "delay"
inputs      = 2
outputs     = 2

[ui]
accent = "#C792EA"

[[param]]
symbol       = "time"
name         = "Time"
min          = 10.0
max          = 2000.0
default      = 350.0
unit         = "ms"
scale        = "log"
smoothing_ms = 250
description  = "Delay time. Changes glide smoothly like a tape delay."

[[param]]
symbol      = "feedback"
name        = "Feedback"
min         = 0.0
max         = 95.0
default     = 40.0
unit        = "%"
description = "Amount of signal fed back into the delay."

[[param]]
symbol      = "tone"
name        = "Tone"
min         = 500.0
max         = 18000.0
default     = 5000.0
unit        = "Hz"
scale       = "log"
description = "Low-pass filter inside the feedback loop: lower values darken each repeat."

[[param]]
symbol      = "mix"
name        = "Mix"
min         = 0.0
max         = 100.0
default     = 35.0
unit        = "%"
description = "Dry/wet balance."

[[param]]
symbol      = "pingpong"
name        = "Ping-pong"
type        = "bool"
default     = false
description = "Repeats bounce between left and right."

[dsp]
code = '''
class Kernel {
public:
    void prepare(double sampleRate, uint32_t maxBlockSize)
    {
        sr_ = sampleRate;
        for (int c = 0; c < 2; ++c)
        {
            line_[c].allocate((size_t)(sampleRate * 2.0) + 8); // max 2000 ms
            dc_[c].setup(sampleRate);
        }
    }

    void reset()
    {
        for (int c = 0; c < 2; ++c)
        {
            line_[c].clear();
            tone_[c].reset();
            dc_[c].reset();
        }
        counter_ = 0;
    }

    void process(const float* const* in, float* const* out, uint32_t frames, const Params& p)
    {
        for (uint32_t i = 0; i < frames; ++i)
        {
            if (counter_ == 0)
                for (int c = 0; c < 2; ++c)
                    tone_[c].setCutoff(p.tone[i], sr_);
            counter_ = (counter_ + 1) & 15;

            const float d = p.time[i] * (float)(sr_ * 0.001);
            const float fb = p.feedback[i] * 0.01f;
            const float mix = p.mix[i] * 0.01f;

            float wet[2];
            for (int c = 0; c < 2; ++c)
                wet[c] = line_[c].readHermite(d);

            // feedback path: filter, gentle saturation (keeps high feedback from running away), DC blocker
            float fbSig[2];
            for (int c = 0; c < 2; ++c)
                fbSig[c] = dc_[c].process(fastTanh(tone_[c].process(wet[c]) * fb));

            if (p.pingpong)
            {
                const float mono = 0.5f * (in[0][i] + in[1][i]);
                line_[0].push(mono + fbSig[1]);
                line_[1].push(fbSig[0]);
            }
            else
            {
                line_[0].push(in[0][i] + fbSig[0]);
                line_[1].push(in[1][i] + fbSig[1]);
            }

            for (int c = 0; c < 2; ++c)
                out[c][i] = in[c][i] + mix * (wet[c] - in[c][i]);
        }
    }

private:
    double sr_ = 48000.0;
    DelayLine line_[2];
    OnePoleLowpass tone_[2];
    DcBlocker dc_[2];
    uint32_t counter_ = 0;
};
'''
