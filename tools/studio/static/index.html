<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin Studio</title>
<style>
  :root {
    --bg: #17181b;
    --panel: #1e1f23;
    --raised: #24262b;
    --line: #34373d;
    --text: #e8e6e1;
    --muted: #8a8d93;
    --accent: #f26a1b;
    --accent-soft: rgba(242, 106, 27, 0.16);
    --ok: #57ab5a;
    --warn: #d4a72c;
    --bad: #e5534b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: 48px 1fr;
  }
  button, select, textarea, input { font: inherit; color: inherit; }
  button {
    background: var(--raised); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: #4a4e56; background: #2b2d33; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #17181b; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #ff7a2e; border-color: #ff7a2e; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--text); background: var(--raised); }
  select { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }

  header {
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  header label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }

  main {
    display: grid; min-height: 0;
    grid-template-columns: 210px minmax(0, 1fr);
  }
  section { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  #work { display: grid; min-height: 0; min-width: 0; border-left: 1px solid var(--line);
          grid-template-rows: minmax(220px, var(--top, 62%)) 10px minmax(150px, 1fr); }
  /* a 10 px grab area with a thin line in the middle */
  #splitter { cursor: row-resize; background: linear-gradient(transparent 4px, var(--line) 4px, var(--line) 6px, transparent 6px); }
  #splitter:hover, #splitter.dragging { background: linear-gradient(transparent 3px, var(--accent) 3px, var(--accent) 7px, transparent 7px); }
  #bottom { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr); min-height: 0; }
  #outPane { border-left: 1px solid var(--line); }
  #outPane .outhead { border-top: 0; }
  #output { flex: 1; }
  #slot { flex: 1; }

  header .logo { margin-right: 18px; font-size: 16px; font-weight: 750; letter-spacing: 0.02em; color: var(--text); }
  header .logo span { color: var(--accent); }
  .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 42px;
    border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .head .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .title b { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; }

  /* recipes */
  #recipes { overflow: auto; padding: 8px; flex: 1; }
  #recipes h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 6px 4px; }
  #recipes h2:first-child { margin-top: 2px; }
  .recipe {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; padding: 6px 8px; border-radius: 6px;
  }
  .recipe .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .recipe .tag { font-size: 11px; color: var(--muted); }
  .recipe.active { background: var(--accent-soft); border-color: rgba(242, 106, 27, 0.4); }
  #newBtn { margin: 8px; }

  /* chat */
  #chat { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2c2f36; }
  .msg.assistant { align-self: flex-start; background: var(--raised); border: 1px solid var(--line); }
  .msg.error { align-self: stretch; background: rgba(229, 83, 75, 0.12); border: 1px solid rgba(229, 83, 75, 0.45); }
  .msg pre { background: #121315; border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow: auto; font: 12px/1.4 var(--mono); white-space: pre; margin: 6px 0; }
  .msg code { font: 12.5px var(--mono); background: #121315; padding: 1px 4px; border-radius: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; margin: 4px 0;
    border-radius: 999px; background: var(--accent-soft); color: #ffb385; font-size: 12.5px; white-space: nowrap;
  }
  .empty { color: var(--muted); margin: auto; text-align: center; max-width: 360px; white-space: normal; }
  .empty b { color: var(--text); }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .examples button { font-size: 12.5px; border-radius: 999px; }
  #composer { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 8px; align-items: flex-end; }
  #prompt {
    flex: 1; resize: none; min-height: 40px; max-height: 180px; padding: 9px 10px;
    background: var(--raised); border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  #prompt:focus { border-color: #4a4e56; }

  /* editor + output */

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .toolbar .spacer { flex: 1; }
  .toolbar .pos { color: var(--muted); font: 12px var(--mono); }
  #editor {
    width: 100%; height: 100%; resize: none; border: 0; outline: none; padding: 12px 14px;
    background: #141518; font: 12.5px/1.5 var(--mono); tab-size: 4; white-space: pre; overflow: auto;
  }
  #editor::placeholder { color: #5d6067; }
  .outhead { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); min-height: 38px; }
  .outhead .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .outhead .spacer { flex: 1; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--raised); color: var(--muted); }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
  #output { overflow: auto; padding: 8px 12px; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; background: #121315; }
  #output .l-pass { color: var(--ok); }
  #output .l-warn { color: var(--warn); }
  #output .l-fail { color: var(--bad); }
  #output .l-cmd { color: var(--muted); }
  #output .l-link { text-decoration: underline dotted; cursor: pointer; }
  /* tabs */
  .tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px; margin-right: 6px; }
  .tab { border: 0; background: transparent; padding: 3px 10px; border-radius: 5px; color: var(--muted); }
  .tab.active { background: var(--raised); color: var(--text); }
  #slot { position: relative; min-height: 0; }
  #slot > * { position: absolute; inset: 0; }

  /* interface editor */
  #uiPane { display: grid; grid-template-columns: minmax(0, 1fr) 320px; background: #141518; }
  #previewBox { min-width: 0; min-height: 0; overflow: auto; padding: 18px; display: flex; flex-direction: column;
                gap: 10px; align-items: center; justify-content: center; }
  #preview { max-width: 100%; border-radius: 6px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.35); cursor: pointer; }
  .pwidth { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; width: 100%; max-width: 420px; }
  .pwidth input { flex: 1; accent-color: var(--accent); }
  #inspector { min-height: 0; overflow: auto; padding: 12px 14px 18px; border-left: 1px solid var(--line);
               background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
  #inspector > * { flex-shrink: 0; } /* the column scrolls; its rows must never squeeze into each other */
  .addrow { display: flex; flex-wrap: wrap; gap: 6px; }
  #inspector h3 { margin: 6px 0 0; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  #inspector .hint { color: var(--muted); font-size: 12px; margin: -4px 0 0; }
  .field { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; font-size: 13px; }
  .field > span { color: var(--muted); }
  .field input[type=text], .field input[type=number], .field select { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .field input[type=color] { width: 44px; height: 26px; padding: 0 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
  .field .row { display: flex; align-items: center; gap: 8px; }
  .gcard { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .gcard.over { border-color: var(--accent); }
  .ghead { display: flex; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
  .ghead input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 6px; }
  .ghead input:hover, .ghead input:focus { border-color: var(--line); background: var(--raised); outline: none; }
  .ghead select { background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; font-size: 12px; }
  .ghead button { padding: 2px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; min-height: 42px; }
  .pchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); cursor: grab; font-size: 12.5px; user-select: none; }
  .pchip small { color: var(--muted); font-size: 11px; }
  .pchip.sel { border-color: var(--accent); background: var(--accent-soft); }
  .pchip.dragging { opacity: 0.4; }
  .pchip.before { box-shadow: -3px 0 0 var(--accent); }
  #uiError { align-self: stretch; }
  .notice { padding: 10px 12px; border-radius: 8px; background: rgba(229, 83, 75, 0.12); border: 1px solid rgba(229, 83, 75, 0.45); white-space: pre-wrap; font-size: 13px; }

  .spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.8s linear infinite; display: inline-block; }
  @keyframes s { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    body { grid-template-rows: auto 1fr; }
    header { flex-wrap: wrap; padding: 8px 16px; }
    main { grid-template-columns: 1fr; grid-auto-rows: auto; overflow: auto; }
    section { min-height: auto; }
    #work { border-left: 0; border-top: 1px solid var(--line); grid-template-rows: 560px 0 auto; }
    #splitter { display: none; }
    #bottom { grid-template-columns: 1fr; }
    #outPane { border-left: 0; border-top: 1px solid var(--line); min-height: 240px; }
    #recipes { max-height: 180px; flex: none; }
    #chatPane { height: 70vh; min-height: 380px; }
    #uiPane { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; }
    #inspector { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  }
</style>
</head>
<body>
<header>
  <h1>Plugin <span>Studio</span></h1>
  <div class="spacer"></div>
  <div class="logo">Monkey<span>tronics</span></div>
  <label>AI
    <select id="backend">
      <option value="auto">Automatic</option>
      <option value="claude">Claude Code</option>
      <option value="api">Claude API</option>
    </select>
  </label>
</header>

<main>
  <section id="side">
    <div class="head"><span class="title">Plugins</span></div>
    <div id="recipes"></div>
    <button id="newBtn" class="primary">+ New plugin</button>
  </section>

  <div id="work">
    <section id="editorPane">
      <div class="toolbar">
        <div class="tabs"><button class="tab active" data-tab="recipe">Recipe</button><button class="tab" data-tab="ui">Interface</button></div>
        <button id="saveBtn" title="Save (Cmd/Ctrl+S)">Save</button>
        <button id="testBtn" title="Compile the DSP and run the test suite">Test</button>
        <button id="buildBtn" title="Build VST3, AU, CLAP, LV2 and the standalone app">Build</button>
        <button id="installBtn" title="Copy the built plugins into your plugin folders">Install</button>
        <button id="openBtn" title="Open the standalone app">Open app</button>
        <div class="spacer"></div>
        <span class="pos" id="pos"></span>
      </div>
      <div id="slot">
        <textarea id="editor" spellcheck="false" placeholder="The recipe (.plugin.toml) appears here. Describe a plugin in the chat, or pick one on the left."></textarea>
        <div id="uiPane" class="hidden">
          <div id="previewBox">
            <div id="uiError" class="hidden"></div>
            <canvas id="preview"></canvas>
            <label class="pwidth">Window width <input type="range" id="pwidth"><span id="pwidthLabel"></span></label>
          </div>
          <div id="inspector"></div>
        </div>
      </div>
    </section>

    <div id="splitter" title="Drag to resize"></div>

    <div id="bottom">
      <section id="chatPane">
        <div class="head"><span class="title" id="chatTitle">Chat</span><button class="ghost" id="clearChat" title="Start this conversation over">Clear</button></div>
        <div id="chat"></div>
        <form id="composer">
          <textarea id="prompt" rows="1" placeholder="Describe an effect, or ask for a change…"></textarea>
          <button class="primary" id="send" type="submit">Send</button>
          <button id="stopAi" type="button" class="hidden">Stop</button>
        </form>
      </section>

      <section id="outPane">
        <div class="outhead">
          <span class="label" id="outLabel">Output</span>
          <span class="spin hidden" id="outSpin"></span>
          <span class="badge ok hidden" id="bPass"></span>
          <span class="badge warn hidden" id="bWarn"></span>
          <span class="badge bad hidden" id="bFail"></span>
          <div class="spacer"></div>
          <button id="fixBtn" class="primary hidden">Fix with AI</button>
          <button id="cancelBtn" class="hidden">Cancel</button>
        </div>
        <div id="output"></div>
      </section>
    </div>
  </div>
</main>

<script>
"use strict";
const TOKEN = "__STUDIO_TOKEN__";
const $ = (id) => document.getElementById(id);

const state = {
  recipes: [],
  backends: {},
  current: null,        // { id, source } or null for a new plugin
  savedText: "",
  chats: loadChats(),   // { key: [{role, content}] }
  aiJob: null,
  toolJob: null,
  lastTest: null,       // { id, ok, lines }
};

// ---------------------------------------------------------------------------------------------------------------
// storage (per-browser convenience only)

function loadChats() {
  try { return JSON.parse(localStorage.getItem("studio.chats") || "{}"); } catch { return {}; }
}
function saveChats() {
  try { localStorage.setItem("studio.chats", JSON.stringify(state.chats)); } catch {}
}
function pref(key, value) {
  try {
    if (value === undefined) return localStorage.getItem("studio." + key);
    localStorage.setItem("studio." + key, value);
  } catch {}
  return null;
}

// ---------------------------------------------------------------------------------------------------------------
// API

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Studio-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function follow(jobId, onEvent) {
  return new Promise((resolve) => {
    const es = new EventSource(`/api/events/${jobId}?token=${encodeURIComponent(TOKEN)}`);
    es.onmessage = (m) => {
      const ev = JSON.parse(m.data);
      onEvent(ev);
      if (ev.type === "done") { es.close(); resolve(ev); }
    };
    es.onerror = () => { es.close(); resolve({ type: "done", ok: false, lost: true }); };
  });
}

// ---------------------------------------------------------------------------------------------------------------
// recipes list

async function refresh() {
  const s = await api("/api/state");
  state.recipes = s.recipes;
  state.backends = s.backends;
  renderBackends();
  renderRecipes();
  renderButtons();
}

function renderBackends() {
  const sel = $("backend");
  const labels = { claude: "Claude Code", api: "Claude API" };
  for (const opt of sel.options) {
    if (opt.value === "auto") continue;
    const b = state.backends[opt.value] || {};
    opt.disabled = !b.available;
    opt.textContent = labels[opt.value] + (b.available ? "" : ` (${b.hint})`);
  }
  const saved = pref("backend");
  if (saved && [...sel.options].some((o) => o.value === saved && !o.disabled)) sel.value = saved;
}

function renderRecipes() {
  const box = $("recipes");
  box.textContent = "";
  for (const [source, label] of [["plugins", "Your plugins"], ["examples", "Examples"]]) {
    const items = state.recipes.filter((r) => r.source === source);
    if (!items.length) continue;
    const h = document.createElement("h2");
    h.textContent = label;
    box.appendChild(h);
    for (const r of items) {
      const b = document.createElement("button");
      b.className = "recipe" + (state.current && state.current.id === r.id && state.current.source === source ? " active" : "");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = r.name;
      b.appendChild(name);
      if (r.app) {
        const t = document.createElement("span");
        t.className = "tag";
        t.textContent = "built";
        b.appendChild(t);
      }
      b.onclick = () => selectRecipe(r.id);
      box.appendChild(b);
    }
  }
}

function dirty() { return $("editor").value !== state.savedText; }

function confirmDiscard() {
  return !dirty() || confirm("The recipe has unsaved changes. Discard them?");
}

async function selectRecipe(id) {
  if (state.current && state.current.id === id && !dirty()) return;
  if (!confirmDiscard()) return;
  const r = await api(`/api/recipe?id=${encodeURIComponent(id)}`);
  state.current = { id: r.id, source: r.source };
  setEditor(r.text, true);
  clearOutput();
  renderRecipes();
  renderChat();
  renderButtons();
}

function newPlugin() {
  if (!confirmDiscard()) return;
  state.current = null;
  state.chats["__new__"] = [];
  saveChats();
  setEditor("", true);
  clearOutput();
  renderRecipes();
  renderChat();
  renderButtons();
  $("prompt").focus();
}

function setEditor(text, saved) {
  $("editor").value = text;
  if (uiEd.tab === "ui") setTimeout(loadUiModel, 0);
  $("editor").setSelectionRange(0, 0);
  $("editor").scrollTop = 0;
  if (saved) state.savedText = text;
  updatePos();
  renderButtons();
}

// ---------------------------------------------------------------------------------------------------------------
// buttons

function renderButtons() {
  const busy = !!state.toolJob;
  const hasText = $("editor").value.trim().length > 0;
  const id = state.current && state.current.id;
  const rec = id && state.recipes.find((r) => r.id === id);
  $("saveBtn").disabled = busy || !hasText || !dirty();
  $("saveBtn").textContent = state.current && state.current.source === "examples" && dirty() ? "Save as my plugin" : "Save";
  $("testBtn").disabled = busy || !hasText;
  $("buildBtn").disabled = busy || !hasText;
  $("installBtn").disabled = busy || !rec || !rec.app;
  $("openBtn").disabled = busy || !rec || !rec.app;
  $("cancelBtn").classList.toggle("hidden", !busy);
  $("outSpin").classList.toggle("hidden", !busy);
  const aiBusy = !!state.aiJob;
  $("send").classList.toggle("hidden", aiBusy);
  $("stopAi").classList.toggle("hidden", !aiBusy);
  $("chatTitle").innerHTML = "";
  const t = document.createElement("b");
  t.textContent = rec ? rec.name : "New plugin";
  $("chatTitle").append("Chat · ", t);
}

// Saves the editor into plugins/<id>.plugin.toml; returns the id or null.
async function save() {
  const text = $("editor").value;
  try {
    const r = await api("/api/recipe", { text });
    const oldKey = chatKey();
    state.current = { id: r.id, source: "plugins" };
    state.savedText = text;
    updatePos();
    if (oldKey !== r.id && state.chats[oldKey] && state.chats[oldKey].length) {
      // the conversation follows the plugin it produced
      state.chats[r.id] = state.chats[oldKey];
      if (oldKey === "__new__") state.chats["__new__"] = [];
      saveChats();
    }
    await refresh();
    renderChat();
    return r.id;
  } catch (e) {
    clearOutput();
    showOutputLine("ERROR " + e.message);
    return null;
  }
}

async function runTool(kind) {
  if (state.toolJob) return;
  let id = state.current && state.current.id;
  if (["test", "build"].includes(kind) && (dirty() || !state.current || state.current.source !== "plugins")) {
    id = await save();
    if (!id) return;
  }
  clearOutput();
  const titles = { test: "Testing", build: "Building", install: "Installing", open: "Opening", check: "Checking" };
  $("outLabel").textContent = titles[kind] || kind;
  const { job } = await api("/api/run", { kind, id });
  state.toolJob = job;
  renderButtons();
  const lines = [];
  const done = await follow(job, (ev) => {
    if (ev.type === "line") { lines.push(ev.text); showOutputLine(ev.text); }
  });
  state.toolJob = null;
  $("outLabel").textContent = (titles[kind] || kind) + (done.cancelled ? ": cancelled" : done.ok ? ": done" : ": failed");
  if (kind === "test") {
    state.lastTest = { id, ok: done.ok, lines };
    $("fixBtn").classList.toggle("hidden", done.ok || done.cancelled);
  }
  if (kind === "build" && !done.ok && !done.cancelled) {
    state.lastTest = { id, ok: false, lines };
    $("fixBtn").classList.remove("hidden");
  }
  if (kind === "build" || kind === "install") await refresh();
  renderButtons();
  return done.ok;
}

// ---------------------------------------------------------------------------------------------------------------
// output

const counts = { pass: 0, warn: 0, fail: 0 };

function clearOutput() {
  $("output").textContent = "";
  counts.pass = counts.warn = counts.fail = 0;
  updateBadges();
  $("fixBtn").classList.add("hidden");
  $("outLabel").textContent = "Output";
}

function showOutputLine(text) {
  const out = $("output");
  const stick = out.scrollTop + out.clientHeight >= out.scrollHeight - 30;
  const div = document.createElement("div");
  if (/^\s*PASS\b/.test(text)) { div.className = "l-pass"; counts.pass++; }
  else if (/^\s*WARN\b/.test(text)) { div.className = "l-warn"; counts.warn++; }
  else if (/^\s*(FAIL|ERROR)\b/.test(text) || /\berror:/.test(text)) { div.className = "l-fail"; if (/^\s*FAIL\b/.test(text)) counts.fail++; }
  else if (text.startsWith("$ ")) div.className = "l-cmd";
  // compiler errors point at lines inside the recipe: click to jump there
  const m = text.match(/\.plugin\.toml:(\d+)(?::(\d+))?/);
  if (m) {
    div.classList.add("l-link");
    div.title = "Show this line in the recipe";
    div.onclick = () => gotoLine(parseInt(m[1], 10));
  }
  div.textContent = text;
  out.appendChild(div);
  updateBadges();
  if (stick) out.scrollTop = out.scrollHeight;
}

function updateBadges() {
  for (const [key, el, word] of [["pass", "bPass", "pass"], ["warn", "bWarn", "warn"], ["fail", "bFail", "fail"]]) {
    $(el).textContent = `${counts[key]} ${word}`;
    $(el).classList.toggle("hidden", counts[key] === 0);
  }
}

function gotoLine(n) {
  const ed = $("editor");
  const lines = ed.value.split("\n");
  let start = 0;
  for (let i = 0; i < Math.min(n - 1, lines.length); i++) start += lines[i].length + 1;
  const end = start + (lines[n - 1] || "").length;
  ed.focus();
  ed.setSelectionRange(start, end);
  const lh = parseFloat(getComputedStyle(ed).lineHeight) || 18;
  ed.scrollTop = Math.max(0, (n - 5) * lh);
  updatePos();
}

function updatePos() {
  const ed = $("editor");
  const before = ed.value.slice(0, ed.selectionStart);
  const line = before.split("\n").length;
  const col = before.length - before.lastIndexOf("\n");
  $("pos").textContent = ed.value ? `Ln ${line}, Col ${col}` + (dirty() ? " · edited" : "") : "";
}

// ---------------------------------------------------------------------------------------------------------------
// chat

function chatKey() { return state.current ? state.current.id : "__new__"; }
function chat() { return (state.chats[chatKey()] ||= []); }

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Minimal markdown: fenced code, inline code, bold. A toml recipe block collapses into a chip,
// since the recipe itself goes to the editor.
function renderMarkdown(text, streaming) {
  const parts = [];
  const re = /```(\w*)\n?([\s\S]*?)(```|$)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    parts.push(inline(text.slice(last, m.index)));
    const closed = m[3] === "```";
    if (m[1] === "toml" || /^\s*\[plugin\]/.test(m[2])) {
      const n = m[2].split("\n").length;
      parts.push(`<span class="chip">${closed || !streaming ? "Recipe → editor" : `Writing recipe… ${n} lines`}</span>`);
    } else {
      parts.push(`<pre>${escapeHtml(m[2])}</pre>`);
    }
    last = re.lastIndex;
    if (!closed) break;
  }
  parts.push(inline(text.slice(last)));
  return parts.join("").replace(/^\s+|\s+$/g, "");
}
function inline(s) {
  return escapeHtml(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}

function bubble(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = html;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

function renderChat() {
  const box = $("chat");
  box.textContent = "";
  const msgs = chat();
  if (!msgs.length) {
    const div = document.createElement("div");
    div.className = "empty";
    const anyAi = Object.values(state.backends).some((b) => b.available);
    div.innerHTML = state.current
      ? `Ask for a change to <b>${escapeHtml(state.current.id)}</b>: a new control, a different sound, a fix.`
      : `<b>Describe the effect you want.</b><br>The AI proposes the controls; confirm, and the recipe appears on the right and is tested automatically.`;
    if (!anyAi) {
      div.innerHTML += `<br><br>No AI is set up yet: sign in to Claude Code (<code>claude auth login</code>), or set <code>ANTHROPIC_API_KEY</code> and run <code>pip install anthropic</code>, then restart the studio.`;
    }
    if (!state.current) {
      const ex = document.createElement("div");
      ex.className = "examples";
      for (const idea of ["A tape saturation with drive, tone and output", "A slow stereo tremolo", "A ping-pong delay that gets darker on every repeat"]) {
        const b = document.createElement("button");
        b.textContent = idea;
        b.onclick = () => { $("prompt").value = idea; autoGrow(); $("prompt").focus(); };
        ex.appendChild(b);
      }
      div.appendChild(ex);
    }
    box.appendChild(div);
    return;
  }
  for (const m of msgs) {
    if (m.role === "user") bubble("user", m.display ? inline(m.display) : renderMarkdown(m.content, false));
    else bubble("assistant", renderMarkdown(m.content, false));
  }
}

async function sendMessage(content, display) {
  if (state.aiJob || !content.trim()) return;
  const key = chatKey();
  const msgs = chat();
  if (!msgs.length) $("chat").textContent = "";
  msgs.push({ role: "user", content, ...(display ? { display } : {}) });
  saveChats();
  const userBubble = bubble("user", display ? inline(display) : renderMarkdown(content, false));

  const out = bubble("assistant", '<span class="spin"></span>');
  let text = "";
  let job;
  try {
    ({ job } = await api("/api/ai", {
      messages: msgs.map(({ role, content }) => ({ role, content })),
      recipe: $("editor").value,
      backend: $("backend").value,
    }));
  } catch (e) {
    out.remove();
    userBubble.remove();
    msgs.pop();
    saveChats();
    bubble("error", escapeHtml(e.message));
    return;
  }
  state.aiJob = job;
  renderButtons();
  const errors = [];
  const done = await follow(job, (ev) => {
    if (ev.type === "delta") {
      text += ev.text;
      out.innerHTML = renderMarkdown(text, true);
      $("chat").scrollTop = $("chat").scrollHeight;
    } else if (ev.type === "error") {
      errors.push(ev.text);
    }
  });
  state.aiJob = null;
  renderButtons();

  const final = done.text || text;
  if (!done.ok || !final.trim()) {
    out.remove();
    userBubble.remove();
    msgs.pop(); // let the user resend
    saveChats();
    if (done.cancelled) return;
    const why = errors.join("\n") ||
      (done.lost ? "Lost the connection to the studio server (was it restarted?). Send the message again." : "The AI did not answer.");
    bubble("error", escapeHtml(why));
    $("prompt").value = display ? $("prompt").value : content;
    return;
  }
  out.innerHTML = renderMarkdown(final, false);
  (state.chats[key] ||= msgs).push({ role: "assistant", content: final });
  saveChats();

  const recipe = extractRecipe(final);
  if (recipe && key === chatKey()) {
    setEditor(recipe, false);
    const id = await save();
    if (id) await runTool("test");
  }
}

function extractRecipe(text) {
  const blocks = [...text.matchAll(/```toml\s*\n([\s\S]*?)```/g)].map((m) => m[1]);
  const recipe = blocks.reverse().find((b) => /^\s*\[plugin\]/m.test(b));
  return recipe ? recipe.replace(/\s+$/, "") + "\n" : null;
}

function fixWithAi() {
  const t = state.lastTest;
  if (!t) return;
  const relevant = t.lines.filter((l) => !l.startsWith("$ "));
  const tail = relevant.slice(-150).join("\n");
  sendMessage("The test run failed. Output:\n```\n" + tail + "\n```\nFix the recipe and resend the whole file.",
              "Fix the problems from the last test run");
}

function autoGrow() {
  const p = $("prompt");
  p.style.height = "auto";
  p.style.height = Math.min(p.scrollHeight, 180) + "px";
}

// ----- layout (mirrors Controls.hpp)

function paramBySymbol(sym) { return uiEd.model.params.find((p) => p.symbol === sym); }

function isTrivialLayout() {
  const g = uiEd.model.groups.filter((x) => x.params.length);
  const order = uiEd.model.params.map((p) => p.symbol);
  return g.length === 1 && !g[0].title && !g[0].columns && g[0].params.join() === order.join();
}

function defaultColumns() {
  const m = uiEd.model, n = Math.max(1, m.params.length);
  let cols = Math.min(m.ui.columns, n);
  if (isTrivialLayout() && !m.ui.columns_set && (n === 5 || n === 6) && m.ui.columns >= 4) cols = 3;
  return cols;
}

function cellSize(p) {
  if (p.control === "buttons") {
    const longest = Math.max(...p.choices.map((c) => [...c].length));
    return [Math.min(472, Math.max(118, 16 + p.choices.length * (longest * 7 + 16))), 84];
  }
  if (p.control === "radio") return [118, 24 + 22 * p.choices.length + 12];
  return uiEd.model.geometry.cells[p.control];
}

function widestRow() {
  let widest = 0;
  const skip = pedalSwitch();
  for (const g0 of uiEd.model.groups) {
    const g = { ...g0, params: g0.params.filter((sym) => sym !== skip) };
    const cols = g.columns || defaultColumns();
    for (let k = 0; k < g.params.length; k += cols)
      widest = Math.max(widest, g.params.slice(k, k + cols).reduce((a, s) => a + cellSize(paramBySymbol(s))[0], 0));
  }
  return widest;
}

function naturalWidth() {
  const G = uiEd.model.geometry;
  return Math.max(G.min_width, widestRow() + 2 * G.pad);
}

// Text sizes and fonts: mirrors label_extra() / title_extra() in tools/recipe.py.
function textExtras() {
  const m = uiEd.model, G = m.geometry, B = G.base_text;
  const tdef = B * G.title_scale[isPedal() ? "pedal" : "flat"];
  return { label: Math.max(0, (m.ui.label_size || B) - B), title: Math.max(0, (m.ui.title_size || tdef) - tdef),
           titleSize: m.ui.title_size || tdef, titleDefault: tdef };
}
const fontFaces = {}; // "<id>/<file>" -> { fam, ready }
function familyFor(file) {
  if (!file || !uiEd.model) return null;
  const key = uiEd.model.id + "/" + file;
  if (!(key in fontFaces)) {
    const fam = "cookbook-font-" + Object.keys(fontFaces).length;
    fontFaces[key] = { fam, ready: false };
    const url = (uiEd.model.builtin_fonts || []).includes(file)
      ? `/api/builtin-font?name=${encodeURIComponent(file)}&token=${encodeURIComponent(TOKEN)}`
      : `/api/asset?id=${encodeURIComponent(uiEd.model.id)}&name=${encodeURIComponent(file)}&token=${encodeURIComponent(TOKEN)}`;
    new FontFace(fam, `url("${url}")`).load()
      .then((f) => { document.fonts.add(f); fontFaces[key].ready = true; renderPreview(); }).catch(() => {});
  }
  return fontFaces[key].ready ? fontFaces[key].fam : null;
}
function cssFont(px, file) {
  const fam = familyFor(file);
  return `${px}px ${fam ? `"${fam}", ` : ""}"DejaVu Sans", Verdana, Geneva, sans-serif`;
}

// Pedal style: mirrors pedal_geometry() in tools/recipe.py. Returns the enclosure and window sizes.
function isPedal() { return uiEd.model.ui.style === "pedal" && uiEd.model.ui.layout !== "free"; }
// the parameter a pedal's footswitch toggles (drawn as the switch, not in the rows), or null
function pedalSwitch() { return isPedal() && uiEd.model.ui.pedal_switch ? uiEd.model.ui.pedal_switch : null; }
function pedalGeometry() {
  const m = uiEd.model, G = m.geometry, P = G.pedal;
  const ew = m.ui.pedal_width || Math.max(P.min_width, Math.round(widestRow() + 2 * G.pad));
  const eh = Math.round(P.top + layout(ew, 0).content + (pedalSwitch() ? P.bottom : P.bottom_plain) + textExtras().title);
  return { ew, eh, W: ew + 2 * P.margin, H: eh + 2 * P.margin };
}
function pedalTextColors() {
  const m = uiEd.model, n = parseInt((m.ui.pedal_color || m.ui.accent).slice(1), 16);
  const lum = 0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255);
  return lum > 140 ? { title: "#1A1A1A", label: "#3B3631", value: "#1A1A1A" } : { title: "#F4F1EA", label: "#D8D2C6", value: "#FFFFFF" };
}

// Rows of controls in a band of width W starting at x = ox, from startY (default: under the header).
function layout(W, startY, ox = 0) {
  const m = uiEd.model, G = m.geometry;
  const items = [], titles = [];
  const X = textExtras();
  let y = startY ?? G.header + (m.ui.subtitle ? G.subtitle : 0) + X.title + 8;
  let any = false;
  const avail = W - 2 * G.pad;
  const skip = pedalSwitch();
  for (const g0 of m.groups) {
    const g = { ...g0, params: g0.params.filter((sym) => sym !== skip) };
    if (!g.params.length) continue;
    any = true;
    if (g.title) { titles.push({ title: g.title, y, x: ox, w: W }); y += G.title; }
    const cols = g.columns || defaultColumns();
    const rows = [];
    let row = [], rowW = 0;
    for (const sym of g.params) {
      const w = cellSize(paramBySymbol(sym))[0];
      if (row.length && (row.length >= cols || rowW + w > avail)) { rows.push([row, rowW]); row = []; rowW = 0; }
      row.push(sym);
      rowW += w;
    }
    if (row.length) rows.push([row, rowW]);
    const blockW = Math.max(...rows.map((r) => r[1]));
    const x0 = ox + Math.max(G.pad, (W - blockW) / 2);
    for (const [r] of rows) {
      let x = x0, rowH = 0;
      for (const sym of r) {
        const [w, h] = cellSize(paramBySymbol(sym));
        items.push({ sym, x, y, w, h });
        x += w;
        rowH = Math.max(rowH, h + X.label);
      }
      y += rowH;
    }
    y += G.gap;
  }
  const content = any ? y - G.gap - (startY ?? 0) : 0;
  return { items, titles, height: y - G.gap + G.bottom, content };
}

// ----- drawing (mirrors Controls.hpp)

function formatValue(p, v) {
  if (p.type === "bool") return v > 0.5 ? "On" : "Off";
  if (p.type === "choice") return p.choices[Math.round(v)] || "?";
  if (p.type === "int") return p.unit ? `${Math.round(v)} ${p.unit}` : `${Math.round(v)}`;
  if (p.unit === "Hz" && Math.abs(v) >= 1000) return `${(v / 1000).toFixed(2)} kHz`;
  if (p.unit === "ms" && Math.abs(v) >= 1000) return `${(v / 1000).toFixed(2)} s`;
  if (p.unit === "%") return `${v.toFixed(0)}%`;
  const range = Math.abs(p.max - p.min), mag = Math.abs(v);
  const dec = range >= 100 || mag >= 100 ? 0 : range >= 10 || mag >= 10 ? 1 : 2;
  return p.unit ? `${v.toFixed(dec)} ${p.unit}` : v.toFixed(dec);
}

function toNorm(p, v) {
  if (p.max <= p.min) return 0;
  if (p.scale === "log" && p.min > 0) return Math.log(v / p.min) / Math.log(p.max / p.min);
  return (v - p.min) / (p.max - p.min);
}

function onAccent(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = 0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255);
  return lum > 140 ? "#17181b" : "#ffffff";
}

function hexMix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t);
  return "#" + ((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, "0");
}
const lighten = (c, t) => hexMix(c, "#ffffff", t);
const darken = (c, t) => hexMix(c, "#000000", t);

// Mirrors cookbook::ui::knob() in Controls.hpp.
function drawKnob(c, kx, ky, r, t, origin, style, bodyColor, ticks, pal, accent) {
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, av = a0 + (a1 - a0) * t, ao = a0 + (a1 - a0) * origin;
  const at = (rad, a) => [kx + Math.cos(a) * rad, ky + Math.sin(a) * rad];
  const line = (p0, p1, color, w) => { c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.moveTo(...p0); c.lineTo(...p1); c.stroke(); };
  const arc = (rad, x0, x1, color, w) => {
    if (Math.abs(x1 - x0) < 0.01) return;
    c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.arc(kx, ky, rad, Math.min(x0, x1), Math.max(x0, x1)); c.stroke();
  };
  const disc = (x, y, rad, color) => { c.fillStyle = color; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill(); };
  const drawTicks = (r0, r1) => { for (let k = 0; k <= 10; k++) { const a = a0 + (a1 - a0) * k / 10; line(at(r0, a), at(r1, a), pal.muted, Math.max(1, r * 0.045)); } };
  const dir = [Math.cos(av), Math.sin(av)], perp = [-dir[1], dir[0]];

  if (style === "vintage") {
    drawTicks(r * 0.84, r * 0.98);
    const body = bodyColor || "#e8dcc0";
    disc(kx, ky, r * 0.74, darken(body, 0.55));
    disc(kx, ky, r * 0.68, body);
    const head = "#2a2420";
    c.fillStyle = head; c.beginPath();
    c.moveTo(kx + dir[0] * r * 0.78, ky + dir[1] * r * 0.78);
    c.lineTo(kx + perp[0] * r * 0.17, ky + perp[1] * r * 0.17);
    c.lineTo(kx - dir[0] * r * 0.34, ky - dir[1] * r * 0.34);
    c.lineTo(kx - perp[0] * r * 0.17, ky - perp[1] * r * 0.17);
    c.closePath(); c.fill();
    disc(kx, ky, r * 0.17, head);
    line(at(r * 0.2, av), at(r * 0.7, av), body, Math.max(1, r * 0.05));
    return;
  }
  if (ticks) drawTicks(r * 0.94, r);
  if (style === "flat") {
    arc(r * 0.76, a0, a1, pal.track, r * 0.24);
    arc(r * 0.76, ao, av, accent, r * 0.24);
    disc(...at(r * 0.76, av), r * 0.15, pal.text);
  } else if (style === "minimal") {
    arc(r * 0.86, a0, a1, pal.track, Math.max(1, r * 0.06));
    arc(r * 0.86, ao, av, accent, Math.max(1.5, r * 0.08));
    c.strokeStyle = bodyColor || pal.muted; c.lineWidth = Math.max(1, r * 0.05);
    c.beginPath(); c.arc(kx, ky, r * 0.66, 0, Math.PI * 2); c.stroke();
    line([kx, ky], at(r * 0.6, av), accent, Math.max(1.5, r * 0.08));
    disc(kx, ky, r * 0.08, accent);
  } else if (style === "fluted") {
    const body = bodyColor || "#141414", lobes = 7, n = lobes * 12;
    const lobed = (scale) => {
      c.beginPath();
      for (let k = 0; k < n; k++) {
        const a = av + Math.PI * 2 * k / n, rr = r * scale * (0.84 + 0.07 * Math.cos(lobes * (a - av)));
        const x = kx + Math.cos(a) * rr, y = ky + Math.sin(a) * rr;
        k ? c.lineTo(x, y) : c.moveTo(x, y);
      }
      c.closePath();
    };
    c.globalAlpha = 0.18; disc(kx + r * 0.02, ky + r * 0.05, r * 0.95, "#000000"); c.globalAlpha = 1;
    disc(kx, ky, r * 0.93, darken(body, 0.25));
    lobed(1); c.fillStyle = lighten(body, 0.03); c.fill();
    c.strokeStyle = "rgba(204,204,204,0.6)"; c.lineWidth = Math.max(1, r * 0.03); c.stroke();
    disc(kx, ky, r * 0.6, lighten(body, 0.04));
    c.strokeStyle = "rgba(255,255,255,0.16)"; c.lineWidth = Math.max(1, r * 0.07);
    c.beginPath(); c.arc(kx, ky, r * 0.52, Math.PI * 1.05, Math.PI * 1.55); c.stroke();
    const w = Math.max(1.5, r * 0.065);
    const p0 = [kx + dir[0] * r * 0.1, ky + dir[1] * r * 0.1], p1 = [kx + dir[0] * r * 0.86, ky + dir[1] * r * 0.86];
    c.beginPath();
    c.moveTo(p0[0] + perp[0] * w, p0[1] + perp[1] * w); c.lineTo(p1[0] + perp[0] * w, p1[1] + perp[1] * w);

    for (let k = 0; k < 40; k++) { const a = Math.PI * 2 * k / 40; line(at(r * 0.7, a), at(r * 0.79, a), darken(base, 0.4), Math.max(1, r * 0.04)); }
    for (let k = 0; k <= 10; k++) {
      const f = k / 10;

}

// Images: loaded once per name, through the studio server.
const imgCache = {};
function imageFor(name) {
  if (!name || !uiEd.model) return null;
  const key = uiEd.model.id + "/" + name;
  if (!imgCache[key]) {
    const img = new Image();
    img.onload = () => renderPreview();
    img.src = `/api/asset?id=${encodeURIComponent(uiEd.model.id)}&name=${encodeURIComponent(name)}&token=${encodeURIComponent(TOKEN)}`;
    imgCache[key] = img;
  }
  const img = imgCache[key];
  return img.complete && img.naturalWidth ? img : null;
}

const KNOBS = ["knob", "small-knob", "large-knob"];
function knobImageOf(p) {
  const m = uiEd.model;
  if (!KNOBS.includes(p.control)) return ["", 1];
  return [p.knob_image || m.ui.knob_image || "", p.knob_frames || m.ui.knob_frames || 1];
}

// Free layout: mirrors free_box() in tools/recipe.py.
function freeBox(p) {
  const m = uiEd.model, G = m.geometry;
  if (KNOBS.includes(p.control)) {
    const [img, frames] = knobImageOf(p);
    let d = G.free_box[p.control][0];
    const dims = img && m.images[img];
    if (dims) d = (dims[1] >= dims[0] ? dims[0] : dims[0] / frames) / m.ui.image_scale;
    d = p.size || d;
    return [d, d];
  }
  if (p.control === "buttons") return [p.size || cellSize(p)[0] - 16, 28];
  if (p.control === "radio") return [p.size || 100, 22 * p.choices.length];
  const [w, h] = G.free_box[p.control];
  if (p.control === "toggle" || !p.size) return [w, h];
  if (p.control === "vslider") return [w, p.size];
  if (["selector", "led", "footswitch", "lever", "checkbox"].includes(p.control)) return [p.size, p.size * h / w];
  return [p.size, h];
}

function freeBase() {
  const m = uiEd.model;
  if (m.ui.size) return m.ui.size;
  const dims = m.images[m.ui.background_image];
  return dims ? [Math.round(dims[0] / m.ui.image_scale), Math.round(dims[1] / m.ui.image_scale)] : [m.width, m.height];
}

function showsLabel(p) { return p.label !== null && p.label !== undefined ? p.label : uiEd.model.ui.labels; }
function showsValueText(p) { return p.value !== null && p.value !== undefined ? p.value : uiEd.model.ui.labels; }

// Draws one control inside its box; mirrors ControlsView::drawControl(). Returns whether it shows a value.
function drawControl(c, p, bx, by, bw, bh, pal, accent) {
  const m = uiEd.model;
  const v = p.default;
  const rrect = (x, y, w, h, r, fill) => { c.fillStyle = fill; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); };
  const origin = p.min < 0 && p.max > 0 && p.scale !== "log" ? toNorm(p, 0) : 0;
  const t = Math.min(1, Math.max(0, toNorm(p, v)));
  if (KNOBS.includes(p.control)) {
    const d = Math.min(bw, bh);
    const [imgName, frames] = knobImageOf(p);
    const img = imageFor(imgName);
    if (img) {
      if (frames <= 1) {
        c.save(); c.translate(bx + d / 2, by + d / 2); c.rotate((t - 0.5) * Math.PI * 1.5);
        c.drawImage(img, -d / 2, -d / 2, d, d); c.restore();
      } else {
        const f = Math.round(t * (frames - 1)), vertical = img.naturalHeight >= img.naturalWidth;
        const fw = vertical ? img.naturalWidth : img.naturalWidth / frames;
        const fh = vertical ? img.naturalHeight / frames : img.naturalHeight;
        c.drawImage(img, vertical ? 0 : f * fw, vertical ? f * fh : 0, fw, fh, bx, by, d, d);
      }
    } else {
      drawKnob(c, bx + d / 2, by + d / 2, d / 2, t, origin, p.knob_style || m.ui.knob_style, m.ui.knob_color, m.ui.knob_ticks, pal, accent);
    }
    return true;
  }
  if (p.control === "slider") {
    const sy = by + bh / 2, th = Math.max(3, bh * 0.22);
    rrect(bx, sy - th / 2, bw, th, th / 2, pal.track);
    const xv = bx + bw * t, xo = bx + bw * origin;
    if (Math.abs(xv - xo) > 0.5) rrect(Math.min(xv, xo), sy - th / 2, Math.abs(xv - xo), th, th / 2, accent);
    c.fillStyle = pal.button; c.beginPath(); c.arc(xv, sy, bh * 0.42, 0, Math.PI * 2); c.fill();
    c.strokeStyle = accent; c.lineWidth = Math.max(1, bh * 0.07); c.stroke();
    return true;
  }
  const disc = (x, y, r, color) => { c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
  const ring = (x, y, r, color, w) => { c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.stroke(); };
  const line = (x0, y0, x1, y1, color, w) => { c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); };
  if (p.control === "vslider") {
    const cx = bx + bw / 2, tw = Math.max(3, bw * 0.22), capH = bw * 0.55;
    const y0 = by + capH / 2, y1 = by + bh - capH / 2, yv = y1 - (y1 - y0) * t, yo = y1 - (y1 - y0) * origin;
    rrect(cx - tw / 2, y0, tw, y1 - y0, tw / 2, pal.track);
    if (Math.abs(yv - yo) > 0.5) rrect(cx - tw / 2, Math.min(yv, yo), tw, Math.abs(yv - yo), tw / 2, accent);
    rrect(bx, yv - capH / 2, bw, capH, 3, pal.button);
    c.strokeStyle = accent; c.lineWidth = 1; c.beginPath(); c.roundRect(bx, yv - capH / 2, bw, capH, 3); c.stroke();
    line(bx + bw * 0.2, yv, bx + bw * 0.8, yv, pal.text, 1);
    return true;
  }
  if (p.control === "number") {
    rrect(bx, by, bw, bh, 4, pal.frame);
    c.strokeStyle = pal.border; c.lineWidth = 1; c.beginPath(); c.roundRect(bx + 0.5, by + 0.5, bw - 1, bh - 1, 4); c.stroke();
    const txt = formatValue(p, v);
    c.fillStyle = pal.text; c.fillText(txt, bx + (bw - c.measureText(txt).width) / 2, by + (bh - 15) / 2 + 1);
    return false;
  }
  if (p.control === "selector") {
    const n = p.type === "choice" ? p.choices.length : Math.round(p.max - p.min) + 1;
    const cur = Math.round(v - p.min);
    const cx = bx + bw / 2, cy = by + bh / 2, r = bw * 0.2;
    const span = Math.min(270, (n - 1) * 90) * Math.PI / 180;
    const ang = (k) => n > 1 ? -span / 2 + span * k / (n - 1) : 0;
    for (let k = 0; k < n; k++) {
      const a = ang(k), dx = Math.sin(a), dy = -Math.cos(a);
      const label = p.type === "choice" ? p.choices[k] : String(Math.round(p.min) + k);
      disc(cx + dx * (r + 5), cy + dy * (r + 5), 1.5, pal.muted);
      const tw = c.measureText(label).width, lr = r + 10 + Math.abs(dx) * tw / 2 + Math.abs(dy) * 7.5;
      c.fillStyle = k === cur ? pal.text : pal.muted;
      c.fillText(label, cx + dx * lr - tw / 2, cy + dy * lr - 7.5);
    }
    const a = ang(Math.max(0, cur)), dx = Math.sin(a), dy = -Math.cos(a);
    disc(cx, cy, r, pal.button); ring(cx, cy, r, pal.border, 1);
    line(cx + dx * r * 0.2, cy + dy * r * 0.2, cx + dx * r * 0.9, cy + dy * r * 0.9, accent, Math.max(2, r * 0.14));
    return false;
  }
  if (["led", "checkbox", "footswitch", "lever"].includes(p.control)) {
    const on = v > 0.5;
    const led = (x, y, r) => {
      if (on) { c.globalAlpha = 0.22; disc(x, y, r * 1.7, accent); c.globalAlpha = 1; disc(x, y, r, accent);
        c.globalAlpha = 0.55; disc(x - r * 0.3, y - r * 0.3, r * 0.35, "#ffffff"); c.globalAlpha = 1; }
      else disc(x, y, r, pal.track);
      ring(x, y, r, pal.border, 1);
    };
    if (p.control === "led") led(bx + bw / 2, by + bh / 2, bw / 2 - 1);
    else if (p.control === "checkbox") {
      rrect(bx, by, bw, bh, 4, on ? accent : pal.frame);
      c.strokeStyle = on ? accent : pal.border; c.lineWidth = 1; c.beginPath(); c.roundRect(bx + 0.5, by + 0.5, bw - 1, bh - 1, 4); c.stroke();
      if (on) {
        const mk = onAccent(accent), w = Math.max(1.5, bw * 0.1);
        line(bx + bw * 0.24, by + bh * 0.52, bx + bw * 0.43, by + bh * 0.7, mk, w);
        line(bx + bw * 0.43, by + bh * 0.7, bx + bw * 0.76, by + bh * 0.3, mk, w);
      }
    } else if (p.control === "footswitch") {
      led(bx + bw / 2, by + bw * 0.11, bw * 0.09);
      const cx = bx + bw / 2, cy = by + bh - bw / 2, r = bw * 0.46, metal = "#b4b8bf";
      disc(cx, cy, r, darken(metal, 0.6)); disc(cx, cy, r * 0.86, darken(metal, 0.3));
      for (let k = 0; k <= 6; k++) { const f = k / 6; disc(cx - r * 0.08 * f, cy - r * 0.08 * f, r * (0.7 - 0.3 * f), lighten(darken(metal, 0.2 - 0.2 * f), 0.4 * f)); }
    } else {
      const cx = bx + bw / 2, cy = by + bh / 2;
      disc(cx, cy, bw * 0.46, darken("#b4b8bf", 0.5)); disc(cx, cy, bw * 0.3, "#8a8e95");
      const ty = on ? by + bw * 0.2 : by + bh - bw * 0.2;
      c.lineCap = "butt"; line(cx, cy, cx, ty, "#c9ccd2", bw * 0.24); disc(cx, ty, bw * 0.2, "#c9ccd2");
      return true;
    }
    return false;
  }
  if (p.control === "radio") {
    const rowH = bh / p.choices.length, cur = Math.round(v);
    p.choices.forEach((label, k) => {
      const y = by + k * rowH;
      ring(bx + 8, y + rowH / 2, 6, pal.muted, 1.2);
      if (k === cur) disc(bx + 8, y + rowH / 2, 3.5, accent);
      c.fillStyle = k === cur ? pal.text : pal.muted;
      c.fillText(label, bx + 22, y + (rowH - 15) / 2 + 1);
    });
    return false;
  }
  if (p.control === "toggle") {
    const on = v > 0.5;
    rrect(bx, by, bw, bh, bh / 2, on ? accent : pal.track);
    c.fillStyle = on ? "#ffffff" : pal.muted;
    c.beginPath(); c.arc(on ? bx + bw - bh / 2 : bx + bh / 2, by + bh / 2, bh * 0.375, 0, Math.PI * 2); c.fill();
    return true;
  }
  if (p.control === "button") {
    const on = v > 0.5;
    rrect(bx, by, bw, bh, 5, on ? accent : pal.button);
    const label = p.type === "choice" ? p.choices[on ? 1 : 0] : on ? "On" : "Off";
    c.fillStyle = on ? onAccent(accent) : pal.text;
    c.fillText(label, bx + (bw - c.measureText(label).width) / 2, by + (bh - 15) / 2 + 1);
    return false;
  }
  if (p.control === "dropdown") {
    const h = 19;
    rrect(bx, by, bw, h, 4, pal.frame);
    c.fillStyle = pal.button; c.beginPath(); c.roundRect(bx + bw - h, by, h, h, [0, 4, 4, 0]); c.fill();
    c.fillStyle = pal.text; c.beginPath();
    c.moveTo(bx + bw - h + 5, by + 7); c.lineTo(bx + bw - 5, by + 7); c.lineTo(bx + bw - h / 2, by + 13); c.fill();
    c.save(); c.beginPath(); c.rect(bx, by, bw - h, h); c.clip();
    c.fillStyle = pal.text; c.fillText(p.choices[Math.round(v)] || "", bx + 4, by + 3); c.restore();
    return false;
  }
  if (p.control === "buttons") {
    const n = p.choices.length, seg = bw / n, cur = Math.round(v);
    p.choices.forEach((label, k) => {
      const radii = n === 1 ? 5 : k === 0 ? [5, 0, 0, 5] : k === n - 1 ? [0, 5, 5, 0] : 0;
      c.fillStyle = k === cur ? accent : pal.button;
      c.beginPath(); c.roundRect(bx + k * seg, by, seg - (k < n - 1 ? 1 : 0), bh, radii); c.fill();
      c.save(); c.beginPath(); c.rect(bx + k * seg, by, seg, bh); c.clip();
      c.fillStyle = k === cur ? onAccent(accent) : pal.text;
      c.fillText(label, bx + k * seg + Math.max(4, (seg - c.measureText(label).width) / 2), by + (bh - 15) / 2 + 1);
      c.restore();
    });
    return false;
  }
  return false;
}

// Flow layout: the control's box inside its cell; mirrors ControlsView::drawCell().
function flowBox(p, cx, cy, cw) {
  const top = cy + 24 + textExtras().label;
  switch (p.control) {
    case "slider": return { x: cx + 12, y: top + 2, w: cw - 24, h: 20, valueY: top + 30 };
    case "toggle": return { x: cx + (cw - 46) / 2, y: top + 16, w: 46, h: 24, valueY: top + 58 + 8 };
    case "button": return { x: cx + (cw - 84) / 2, y: top + 14, w: 84, h: 30, valueY: -1 };
    case "dropdown": return { x: cx + 7, y: top + 16, w: cw - 14, h: 19, valueY: -1 };
    case "buttons": return { x: cx + 8, y: top + 4, w: cw - 16, h: 28, valueY: -1 };
    case "vslider": return { x: cx + (cw - 24) / 2, y: top, w: 24, h: 110, valueY: top + 118 };
    case "number": return { x: cx + (cw - 84) / 2, y: top + 6, w: 84, h: 22, valueY: -1 };
    case "selector": return { x: cx + (cw - 110) / 2, y: top, w: 110, h: 110, valueY: -1 };
    case "led": case "checkbox": return { x: cx + (cw - 22) / 2, y: top + 8, w: 22, h: 22, valueY: -1 };
    case "footswitch": return { x: cx + (cw - 56) / 2, y: top, w: 56, h: 76, valueY: -1 };
    case "lever": return { x: cx + (cw - 28) / 2, y: top + 6, w: 28, h: 48, valueY: top + 62 };
    case "radio": return { x: cx + 12, y: top, w: cw - 24, h: 22 * p.choices.length, valueY: -1 };
    default: {
      const d = p.control === "small-knob" ? 40 : p.control === "large-knob" ? 88 : 58;
      return { x: cx + (cw - d) / 2, y: top, w: d, h: d, valueY: top + d + 8 };
    }
  }
}

function renderPreview() {
  const m = uiEd.model;
  if (!m) return;
  const free = m.ui.layout === "free";
  const G = m.geometry;
  let W, H, L = null;
  const slider = $("pwidth");
  const pedal = !free && isPedal();
  if (free || pedal) {
    if (free) [W, H] = freeBase();
    else { const pg = pedalGeometry(); W = pg.W; H = pg.H; }
    slider.closest("label").classList.add("hidden");
  } else {
    slider.closest("label").classList.remove("hidden");
    const natural = naturalWidth();
    slider.min = G.min_width;
    slider.max = Math.round(Math.max(natural * 1.6, natural + 200));
    W = Math.round(uiEd.width || natural);
    slider.value = W;
    L = layout(W);
    H = Math.round(L.height);
    $("pwidthLabel").textContent = `${W} × ${H}`;
  }

  // shown at its real size, or smaller when the space is tight
  const cv = $("preview"), dpr = window.devicePixelRatio || 1;
  const box = $("previewBox");
  const room = [box.clientWidth - 36, box.clientHeight - 36 - (free ? 0 : 40)];
  const fit = room[0] > 0 && room[1] > 0 ? Math.max(0.25, Math.min(1, room[0] / W, room[1] / H)) : 1;
  uiEd.designW = W;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = Math.round(W * fit) + "px";
  cv.style.cursor = free ? "move" : "pointer";
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pal = PALETTE[m.ui.theme] || PALETTE.dark;
  const accent = m.ui.accent;
  const font = (px) => `${px}px "DejaVu Sans", Verdana, Geneva, sans-serif`;
  c.textBaseline = "top";
  c.fillStyle = m.ui.background || pal.bg;
  c.fillRect(0, 0, W, H);

  // background image: the design itself (free) or a cover-cropped backdrop (flow)
  const bg = imageFor(m.ui.background_image);
  if (bg) {
    if (free) c.drawImage(bg, 0, 0, W, H);
    else {
      const ia = bg.naturalWidth / bg.naturalHeight, wa = W / H;
      let sx = 0, sy = 0, sw = bg.naturalWidth, sh = bg.naturalHeight;
      if (ia > wa) { sw = bg.naturalHeight * wa; sx = (bg.naturalWidth - sw) / 2; }
      else { sh = bg.naturalWidth / wa; sy = (bg.naturalHeight - sh) / 2; }
      c.drawImage(bg, sx, sy, sw, sh, 0, 0, W, H);
    }
  }

  const centered = (text, cx, cw, y, color) => {
    c.fillStyle = color;
    c.fillText(text, cx + Math.max(0, (cw - c.measureText(text).width) / 2), y);
  };
  c.font = font(13);
  uiEd.hits = [];
  uiEd.handles = [];
  const X = textExtras();
  const labelFont = (p) => cssFont((p && p.label_size) || m.ui.label_size || 13, (p && p.label_font) || m.ui.label_font);
  const valueFont = (p) => cssFont((p && p.value_size) || m.ui.value_size || 13, (p && p.value_font) || m.ui.value_font);
  // where the name and brand were drawn, so they can be dragged (and highlighted when selected)
  const markText = (key, text, x, y, size) => {
    const w = c.measureText(text).width, h = size * 1.2;
    if (uiEd.selected === key) {
      c.save(); c.setLineDash([4, 3]); c.strokeStyle = accent; c.lineWidth = 1.5;
      c.strokeRect(x - 3, y - 3, w + 6, h + 6); c.restore();
    }
    uiEd.hits.push({ sym: key, x: x - 3, y: y - 3, w: w + 6, h: h + 6, tx: x, ty: y });
  };
  // The selected shape's outline and handles: the ends of a line, a circle's radius, and for the others the
  // four corners (resize) and a knob above the top edge (rotate). Recorded in uiEd.handles for dragging.
  const shapeHandles = (sh, k, g) => {
    const cs = Math.cos(g.rot), sn = Math.sin(g.rot);
    const world = (lx, ly) => [g.cx + lx * cs - ly * sn, g.cy + lx * sn + ly * cs]; // lx, ly from the center
    const dot = (x, y, round) => {
      c.beginPath();
      if (round) c.arc(x, y, 4.5, 0, Math.PI * 2); else c.rect(x - 4, y - 4, 8, 8);
      c.fillStyle = "#fff"; c.fill(); c.strokeStyle = accent; c.lineWidth = 1.5; c.stroke();
    };
    c.save(); c.setLineDash([]);
    if (sh.type === "line") {
      for (const [end, px, py] of [[1, sh.x, sh.y], [2, sh.x2, sh.y2]]) {
        const [x, y] = world(px - g.cx, py - g.cy);
        dot(x, y, true);
        uiEd.handles.push({ k, kind: "end", end, x, y });
      }
    } else if (sh.type === "circle") {
      c.setLineDash([4, 3]); c.strokeStyle = accent; c.lineWidth = 1.5;
      c.beginPath(); c.arc(sh.x, sh.y, Math.max(0, sh.r) + 3, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
      dot(sh.x + sh.r, sh.y, false);
      uiEd.handles.push({ k, kind: "radius", x: sh.x + sh.r, y: sh.y });
    } else {
      const hw = g.bw / 2, hh = g.bh / 2;
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sy]) => [sx, sy, ...world(sx * hw, sy * hh)]);
      c.setLineDash([4, 3]); c.strokeStyle = accent; c.lineWidth = 1.5;
      c.beginPath(); corners.forEach(([, , x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.stroke();
      c.setLineDash([]);
      const top = world(0, -hh), knob = world(0, -hh - 22);
      c.beginPath(); c.moveTo(...top); c.lineTo(...knob); c.stroke();
      dot(...knob, true);
      uiEd.handles.push({ k, kind: "rotate", x: knob[0], y: knob[1], cx: g.cx, cy: g.cy });
      for (const [sx, sy, x, y] of corners) {
        dot(x, y, false);
        // the opposite corner stays put while this one is dragged
        const [fx, fy] = world(-sx * hw, -sy * hh);
        uiEd.handles.push({ k, kind: "corner", sx, sy, x, y, fx, fy, rot: g.rot, bw: g.bw, bh: g.bh });
      }
    }
    c.restore();
  };
  // [[ui.shape]] decorations, behind the controls (mirrors ControlsView::drawShapes)
  const drawShapes = () => {
    (m.shapes || []).forEach((sh, k) => {
      const w = Math.max(0.5, sh.width);
      c.save();
      // the shape's own box (before rotation) and its center
      let bx, by, bw, bh;
      if (sh.type === "line") { bx = Math.min(sh.x, sh.x2); by = Math.min(sh.y, sh.y2); bw = Math.abs(sh.x2 - sh.x); bh = Math.abs(sh.y2 - sh.y); }
      else if (sh.type === "rect" || sh.type === "image") { bx = sh.x; by = sh.y; bw = sh.w; bh = sh.h; }
      else if (sh.type === "circle") { bx = sh.x - sh.r; by = sh.y - sh.r; bw = bh = 2 * sh.r; }
      else { c.font = cssFont(sh.size, sh.font); bx = sh.x; by = sh.y; bw = c.measureText(sh.text).width; bh = sh.size * 1.2; }
      const cx = bx + bw / 2, cy = by + bh / 2, rot = (sh.rotation || 0) * Math.PI / 180;
      if (rot && sh.type !== "circle") { c.translate(cx, cy); c.rotate(rot); c.translate(-cx, -cy); }
      if (sh.type === "line") {
        if (sh.color && sh.width > 0) {
          c.strokeStyle = sh.color; c.lineWidth = w; c.beginPath(); c.moveTo(sh.x, sh.y); c.lineTo(sh.x2, sh.y2); c.stroke();
        }
      } else if (sh.type === "rect") {
        c.beginPath(); c.roundRect(sh.x, sh.y, sh.w, sh.h, Math.min(sh.radius, Math.abs(sh.w) / 2, Math.abs(sh.h) / 2));
        if (sh.fill) { c.fillStyle = sh.fill; c.fill(); }
        if (sh.color && sh.width > 0) { c.strokeStyle = sh.color; c.lineWidth = w; c.stroke(); }
      } else if (sh.type === "circle") {
        c.beginPath(); c.arc(sh.x, sh.y, Math.max(0, sh.r), 0, Math.PI * 2);
        if (sh.fill) { c.fillStyle = sh.fill; c.fill(); }
        if (sh.color && sh.width > 0) { c.strokeStyle = sh.color; c.lineWidth = w; c.stroke(); }
      } else if (sh.type === "image") {
        const img = imageFor(sh.image);
        if (img) c.drawImage(img, sh.x, sh.y, sh.w, sh.h);
        else { c.setLineDash([4, 3]); c.strokeStyle = pal.muted; c.lineWidth = 1; c.strokeRect(sh.x, sh.y, sh.w, sh.h); }
      } else {
        c.fillStyle = sh.color || m.ui.label_color || (pt ? pt.label : pal.muted);
        c.fillText(sh.text, sh.x, sh.y);
      }
      c.restore();
      // hit box: the rotated box's bounds, a few px wider so thin lines are easy to grab
      const cs = Math.abs(Math.cos(rot)), sn = Math.abs(Math.sin(rot));
      const rw = (sh.type === "circle" ? bw : bw * cs + bh * sn) + 8, rh = (sh.type === "circle" ? bh : bw * sn + bh * cs) + 8;
      const box = { x: cx - rw / 2, y: cy - rh / 2, w: rw, h: rh };
      if (uiEd.selected === "shape:" + k) shapeHandles(sh, k, { bx, by, bw, bh, cx, cy, rot });
      uiEd.hits.push({ sym: "shape:" + k, ...box });
    });
  };
  const titleFont = () => cssFont(X.titleSize, m.ui.title_font);
  const pt = pedal ? pedalTextColors() : null;
  const labelOf = (p) => p.label_color || m.ui.label_color || (pt ? pt.label : pal.muted);
  const valueOf = (p) => p.value_color || m.ui.value_color || (pt ? pt.value : pal.text);

  if (free) {
    drawShapes();
    for (const p of m.params) {
      const [w, h] = freeBox(p);
      const x = p.x || 0, y = p.y || 0;
      if (showsLabel(p)) { c.font = labelFont(p); centered(p.short_name || p.name, x, w, y - 20 - X.label, labelOf(p)); }
      c.font = font(13);
      const hasValue = drawControl(c, p, x, y, w, h, pal, accent);
      if (hasValue && showsValueText(p)) { c.font = valueFont(p); centered(formatValue(p, p.default), x, w, y + h + 6, valueOf(p)); }
      if (uiEd.selected === p.symbol) {
        c.save(); c.setLineDash([4, 3]); c.strokeStyle = accent; c.lineWidth = 1.5;
        c.strokeRect(x - 3, y - 3, w + 6, h + 6); c.restore();
      }
      uiEd.hits.push({ sym: p.symbol, x: x - 4, y: y - (showsLabel(p) ? 22 : 4), w: w + 8, h: h + (showsLabel(p) ? 26 : 8) });
    }
    return;
  }

  if (pedal) {
    const P = G.pedal, pg = pedalGeometry();
    const ex = P.margin, ey = P.margin, ew = pg.ew, eh = pg.eh, rad = 14;
    const paint = m.ui.pedal_color || accent;
    const rr = (x, y, w, h, r, fill) => { c.fillStyle = fill; c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); };
    c.globalAlpha = 0.35; rr(ex + 2, ey + 7, ew, eh + 2, rad + 2, "#000000"); c.globalAlpha = 1;
    rr(ex, ey, ew, eh, rad, darken(paint, 0.35));
    rr(ex + 2, ey + 2, ew - 4, eh - 4, rad - 2, paint);
    c.strokeStyle = "rgba(255,255,255,0.28)"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(ex + rad, ey + 3.5); c.lineTo(ex + ew - rad, ey + 3.5); c.stroke();
    drawShapes();
    L = layout(ew, ey + P.top, ex);
    for (const t of L.titles) {
      c.font = labelFont(null);
      c.fillStyle = m.ui.label_color || pt.label; c.fillText(t.title, t.x + G.pad, t.y + 6);
      const tw = c.measureText(t.title).width;
      c.strokeStyle = pal.border; c.lineWidth = 1; c.beginPath();
      c.moveTo(t.x + G.pad + tw + 8, t.y + 13.5); c.lineTo(t.x + t.w - G.pad, t.y + 13.5); c.stroke();
    }
    drawFlowItems(L.items);
    const sw = pedalSwitch();
    const yb = ey + eh - ((sw ? P.bottom : P.bottom_plain) + X.title - 10);
    c.font = titleFont();
    const nw = c.measureText(m.name).width;
    const [nx, ny] = m.ui.title_pos || [ex + (ew - nw) / 2, yb];
    c.fillStyle = m.ui.title_color || pt.title; c.fillText(m.name, nx, ny);
    markText("__title", m.name, nx, ny, X.titleSize);
    c.font = labelFont(null);
    const line = m.ui.subtitle || m.brand, lw = c.measureText(line).width;
    const [bx2, by2] = m.ui.brand_pos || [ex + (ew - lw) / 2, yb + 30 + X.title];
    c.fillStyle = m.ui.label_color || pt.label; c.fillText(line, bx2, by2);
    markText("__brand", line, bx2, by2, m.ui.label_size || 13);
    if (sw) {
      const fx = ex + ew / 2, fy = ey + eh - 36, metal = "#b4b8bf", r = 22;
      const dsc = (x, y, rad, col) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill(); };
      dsc(fx, fy, r, darken(metal, 0.6)); dsc(fx, fy, r * 0.86, darken(metal, 0.3));
      for (let k = 0; k <= 6; k++) { const f = k / 6; dsc(fx - r * 0.08 * f, fy - r * 0.08 * f, r * (0.7 - 0.3 * f), lighten(darken(metal, 0.2 - 0.2 * f), 0.4 * f)); }
      const on = (paramBySymbol(sw) || {}).default > 0.5;
      if (on) {
        c.globalAlpha = 0.28; dsc(fx - 48, fy, 9, "#e5352b"); c.globalAlpha = 1;
        dsc(fx - 48, fy, 5, "#e5352b"); c.globalAlpha = 0.6; dsc(fx - 49.5, fy - 1.5, 1.8, "#ffffff"); c.globalAlpha = 1;
      } else dsc(fx - 48, fy, 5, darken("#e5352b", 0.65));
      c.strokeStyle = "rgba(0,0,0,0.45)"; c.lineWidth = 1; c.beginPath(); c.arc(fx - 48, fy, 5, 0, Math.PI * 2); c.stroke();
      uiEd.hits.push({ sym: sw, x: fx - r, y: fy - r, w: 2 * r, h: 2 * r });
    }
    return;
  }

  // header
  const [tx, ty] = m.ui.title_pos || [G.pad, 14];
  c.font = titleFont(); c.fillStyle = m.ui.title_color || pal.text; c.fillText(m.name, tx, ty);
  markText("__title", m.name, tx, ty, X.titleSize);
  c.font = labelFont(null);
  c.fillStyle = m.ui.label_color || pal.muted;
  const [bx1, by1] = m.ui.brand_pos || [W - G.pad - c.measureText(m.brand).width, 20];
  c.fillText(m.brand, bx1, by1);
  markText("__brand", m.brand, bx1, by1, m.ui.label_size || 13);
  c.fillStyle = m.ui.label_color || pal.muted;
  if (m.ui.subtitle) c.fillText(m.ui.subtitle, tx, ty + 24 + X.title);
  const hy = G.header + (m.ui.subtitle ? G.subtitle : 0) + X.title - 8;
  c.globalAlpha = 0.55; c.strokeStyle = accent; c.lineWidth = 1;
  c.beginPath(); c.moveTo(G.pad, hy + 0.5); c.lineTo(W - G.pad, hy + 0.5); c.stroke(); c.globalAlpha = 1;
  drawShapes();

  for (const t of L.titles) {
    c.font = labelFont(null);
    c.fillStyle = m.ui.label_color || pal.muted; c.fillText(t.title, t.x + G.pad, t.y + 6);
    const tw = c.measureText(t.title).width;
    c.strokeStyle = pal.border; c.lineWidth = 1; c.beginPath();
    c.moveTo(G.pad + tw + 8, t.y + 6 + 7.5); c.lineTo(W - G.pad, t.y + 6 + 7.5); c.stroke();
  }

  drawFlowItems(L.items);

  function drawFlowItems(items) {
    for (const it of items) {
      const p = paramBySymbol(it.sym);
      const { x: cx, y: cy, w: cw } = it;
      c.font = labelFont(p);
      centered(p.short_name || p.name, cx, cw, cy, labelOf(p));
      const box = flowBox(p, cx, cy, cw);
      c.font = font(13);
      drawControl(c, p, box.x, box.y, box.w, box.h, pal, accent);
      if (box.valueY >= 0) { c.font = valueFont(p); centered(formatValue(p, p.default), cx, cw, box.valueY, valueOf(p)); }
      if (uiEd.selected === p.symbol) {
        c.save(); c.setLineDash([4, 3]); c.strokeStyle = accent; c.lineWidth = 1.5;
        c.beginPath(); c.roundRect(cx + 2, cy - 4, cw - 4, it.h - 2, 6); c.stroke(); c.restore();
      }
      uiEd.hits.push({ sym: p.symbol, x: cx, y: cy - 4, w: cw, h: it.h, box });
    }
  }
}

// Switching to the free layout starts every control where the flow layout had it.
function toFreeLayout() {
  const m = uiEd.model;
  const W = Math.round(uiEd.width || naturalWidth());
  const L = layout(W);
  for (const it of L.items) {
    const p = paramBySymbol(it.sym);
    const box = flowBox(p, it.x, it.y, it.w);
    if (p.x === null || p.x === undefined) { p.x = Math.round(box.x); p.y = Math.round(box.y); }
  }
  if (!m.ui.size && !m.ui.background_image) m.ui.size = [W, Math.round(L.height)];
  m.ui.layout = "free";
}

// ----- inspector

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k !== null && k !== undefined) e.append(k);
  return e;
}

function field(label, ...controls) {
  return el("label", { class: "field" }, el("span", {}, label), el("div", { class: "row" }, ...controls));
}

// A color that can be left to its default: a checkbox turns the custom color on, the picker sets it.
function colorField(label, obj, key, fallback, changed) {
  const pick = el("input", { type: "color", value: (obj[key] || fallback).toLowerCase(), disabled: !obj[key],
    oninput: (e) => { obj[key] = e.target.value.toUpperCase(); changed(false); } });
  const on = el("input", { type: "checkbox", checked: !!obj[key], title: "Use a custom color",
    onchange: (e) => { obj[key] = e.target.checked ? pick.value.toUpperCase() : null; changed(); } });
  return field(label, on, pick);
}

// Switching between flat and pedal keeps the look: the flat background becomes the pedal's paint (and
// back), and texts keep the colors and sizes they had instead of taking the other style's defaults.
function switchStyle(style) {
  const m = uiEd.model, u = m.ui;
  if ((u.style || "flat") === style) return;
  const pal = PALETTE[u.theme] || PALETTE.dark;
  const before = isPedal() ? pedalTextColors() : { title: pal.text, label: pal.muted, value: pal.text };
  const titleSize = textExtras().titleSize;
  if (style === "pedal") {
    if (!u.pedal_color && u.background) u.pedal_color = u.background;
    // the backdrop around the pedal goes back to the theme's when it would hide the enclosure
    if (u.background && u.background.toUpperCase() === (u.pedal_color || "").toUpperCase()) u.background = null;
  } else if (!u.background && u.pedal_color) {
    u.background = u.pedal_color;
  }
  u.title_color = u.title_color || before.title.toUpperCase();
  u.label_color = u.label_color || before.label.toUpperCase();
  u.value_color = u.value_color || before.value.toUpperCase();
  u.title_size = u.title_size || Math.round(titleSize);
  u.style = style;
}

// A font menu: the inherited choice, the built-in fonts and the files added to this plugin.
// inherited = null for a global setting ("Default" = DejaVu Sans), else the global font a control falls back to.
function fontPicker(obj, key, inherited, changed) {
  const m = uiEd.model;
  const label = (n) => n.includes("/") ? n.split("/").pop() : n;
  const sel = el("select", { onchange: (e) => { obj[key] = e.target.value || null; changed(); } },
    el("option", { value: "" }, inherited === null ? "Default (DejaVu Sans)" : `Same as all (${inherited ? label(inherited) : "Default"})`));
  const builtin = el("optgroup", { label: "Built-in" });
  for (const n of m.builtin_fonts || []) builtin.append(el("option", { value: n }, n));
  sel.append(builtin);
  const mine = new Set(uiEd.assets.filter((a) => a.kind === "font").map((a) => a.name));
  if (obj[key] && !(m.builtin_fonts || []).includes(obj[key])) mine.add(obj[key]);
  if (mine.size) {
    const g = el("optgroup", { label: "Added to this plugin" });
    for (const n of [...mine].sort()) g.append(el("option", { value: n }, label(n)));
    sel.append(g);
  }
  sel.value = obj[key] || "";
  return sel;
}

// A size in px, showing the value in effect; setting it back to the inherited size clears the override.
function sizePicker(obj, key, inherited, changed) {
  return el("input", { type: "number", min: 7, max: 96, step: 1, value: obj[key] ?? inherited, style: "width:64px",
    title: `Size in pixels (inherited: ${inherited})`,
    onchange: (e) => {
      const v = parseFloat(e.target.value);
      obj[key] = Number.isFinite(v) && v !== inherited ? Math.max(7, Math.min(96, v)) : null;
      changed();
    } });
}

function columnsSelect(value, auto, onchange) {
  const s = el("select", { onchange: (e) => onchange(parseInt(e.target.value, 10)) });
  if (auto) s.append(el("option", { value: 0 }, "Auto"));
  for (let n = 1; n <= 8; n++) s.append(el("option", { value: n }, auto ? `${n} per row` : String(n)));
  s.value = value;
  return s;
}

function renderInspector() {
  const m = uiEd.model, box = $("inspector");
  box.textContent = "";
  if (!m) return;
  const changed = (rerender = true) => { if (rerender) renderInspector(); renderPreview(); scheduleApply(); };

  box.append(el("h3", {}, "Look"));
  box.append(field("Accent", el("input", { type: "color", value: m.ui.accent.toLowerCase(),
    oninput: (e) => { m.ui.accent = e.target.value.toUpperCase(); changed(false); } })));
  const theme = el("select", { onchange: (e) => { m.ui.theme = e.target.value; changed(); } },
    el("option", { value: "dark" }, "Dark"), el("option", { value: "light" }, "Light"));
  theme.value = m.ui.theme;
  box.append(field("Theme", theme));
  const custom = el("input", { type: "checkbox", checked: !!m.ui.background,
    onchange: (e) => { m.ui.background = e.target.checked ? (PALETTE[m.ui.theme] || PALETTE.dark).bg.toUpperCase() : null; changed(); } });
  const bg = el("input", { type: "color", value: (m.ui.background || (PALETTE[m.ui.theme] || PALETTE.dark).bg).toLowerCase(),
    disabled: !m.ui.background, oninput: (e) => { m.ui.background = e.target.value.toUpperCase(); changed(false); } });
  box.append(field("Background", custom, bg));
  const styleSel = el("select", { onchange: (e) => { switchStyle(e.target.value); changed(); } },
    el("option", { value: "flat" }, "Flat"), el("option", { value: "pedal" }, "Pedal"));
  styleSel.value = m.ui.style || "flat";
  box.append(field("Style", styleSel));
  if (m.ui.style === "pedal") {
    box.append(colorField("Pedal color", m.ui, "pedal_color", m.ui.accent, changed));
    const P = m.geometry.pedal;
    const auto = !m.ui.pedal_width;
    const cur = m.ui.pedal_width || pedalGeometry().ew;
    const label = el("span", { class: "hint" }, auto ? "auto" : `${cur} px`);
    const range = el("input", { type: "range", min: P.min_width, max: 1000, value: cur, style: "flex:1",
      oninput: (e) => { m.ui.pedal_width = parseInt(e.target.value, 10); label.textContent = `${m.ui.pedal_width} px`; changed(false); } });
    const autoBox = el("input", { type: "checkbox", checked: auto, title: "Fit the widest row",
      onchange: (e) => { m.ui.pedal_width = e.target.checked ? null : pedalGeometry().ew; changed(); } });
    box.append(field("Pedal width", autoBox, range, label));
    const swSel = el("select", { onchange: (e) => { m.ui.pedal_switch = e.target.value; changed(); } },
      el("option", { value: "" }, "None"));
    for (const p of m.params)
      if (p.type === "bool" || (p.type === "choice" && p.choices.length === 2))
        swSel.append(el("option", { value: p.symbol }, p.short_name || p.name));
    swSel.value = m.ui.pedal_switch || "";
    box.append(field("Footswitch", swSel));
    box.append(el("p", { class: "hint" }, "A working footswitch with an LED for an on/off parameter (for example On or Bypass). That control leaves the rows."));
  }
  box.append(field("Subtitle", el("input", { type: "text", value: m.ui.subtitle, maxlength: 60, placeholder: "Optional",
    oninput: (e) => { m.ui.subtitle = e.target.value; changed(false); } })));
  const pal = PALETTE[m.ui.theme] || PALETTE.dark;
  const tdef = isPedal() ? pedalTextColors() : { title: pal.text, label: pal.muted, value: pal.text };
  box.append(colorField("Title text", m.ui, "title_color", tdef.title, changed));
  box.append(colorField("Label text", m.ui, "label_color", tdef.label, changed));
  box.append(colorField("Value text", m.ui, "value_color", tdef.value, changed));
  box.append(field("Title font", fontPicker(m.ui, "title_font", null, changed), sizePicker(m.ui, "title_size", Math.round(textExtras().titleDefault * 10) / 10, changed)));
  box.append(field("Label font", fontPicker(m.ui, "label_font", null, changed), sizePicker(m.ui, "label_size", 13, changed)));
  box.append(field("Value font", fontPicker(m.ui, "value_font", null, changed), sizePicker(m.ui, "value_size", 13, changed)));
  box.append(el("p", { class: "hint" }, "Built-in fonts, or add your own .ttf/.otf with \"+ Add image or font\" below (for example from fonts.google.com)."));
  const posRow = (label, key) => {
    const v = m.ui[key];
    return field(label, el("span", { class: "hint" }, v ? `${v[0]}, ${v[1]}` : "automatic"),
      v ? el("button", { onclick: () => { m.ui[key] = null; changed(); } }, "Reset") : null);
  };
  box.append(posRow("Title place", "title_pos"));
  box.append(posRow("Brand place", "brand_pos"));
  box.append(el("p", { class: "hint" }, "Drag the plugin name or the brand on the preview to place them."));
  box.append(field("Per row", columnsSelect(m.ui.columns, false, (n) => { m.ui.columns = n; m.ui.columns_set = true; changed(); })));
  const knobStyle = el("select", { onchange: (e) => { m.ui.knob_style = e.target.value; changed(); } });
  for (const k of m.knob_styles) knobStyle.append(el("option", { value: k }, k[0].toUpperCase() + k.slice(1)));
  knobStyle.value = m.ui.knob_style;
  box.append(field("Knobs", knobStyle));
  const kcustom = el("input", { type: "checkbox", checked: !!m.ui.knob_color,
    onchange: (e) => { m.ui.knob_color = e.target.checked ? ({ vintage: "#E8DCC0", metal: "#B4B8BF", fluted: "#141414" }[m.ui.knob_style] || "#34373E") : null; changed(); } });
  const kcolor = el("input", { type: "color", value: (m.ui.knob_color || "#34373e").toLowerCase(), disabled: !m.ui.knob_color,
    oninput: (e) => { m.ui.knob_color = e.target.value.toUpperCase(); changed(false); } });
  box.append(field("Knob color", kcustom, kcolor));
  box.append(field("Scale marks", el("input", { type: "checkbox", checked: m.ui.knob_ticks,
    onchange: (e) => { m.ui.knob_ticks = e.target.checked; changed(); } })));

  box.append(el("h3", {}, "Layout"));
