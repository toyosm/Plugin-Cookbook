function deleteSelectedShape() {
  const m = uiEd.model;
  if (!m || !uiEd.selected || !uiEd.selected.startsWith("shape:")) return false;
  m.shapes.splice(parseInt(uiEd.selected.slice(6), 10), 1);
  uiEd.selected = null;
  renderInspector(); renderPreview(); scheduleApply();
  return true;
}

// Delete / Backspace removes the selected shape, unless you are typing in a field.
document.addEventListener("keydown", (e) => {
  if ((e.key !== "Delete" && e.key !== "Backspace") || uiEd.tab !== "ui") return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (deleteSelectedShape()) e.preventDefault();
});

function moveParam(sym, gi, beforeSym) {
  if (!sym || sym === beforeSym) return;
  const groups = uiEd.model.groups;
  for (const g of groups) g.params = g.params.filter((s) => s !== sym);
  const target = groups[gi].params;
  const at = beforeSym ? target.indexOf(beforeSym) : -1;
  if (at >= 0) target.splice(at, 0, sym); else target.push(sym);
  uiEd.selected = sym;
  renderInspector(); renderPreview(); scheduleApply();
}

function removeGroup(gi) {
  const groups = uiEd.model.groups;
  const into = groups[gi > 0 ? gi - 1 : 1];
  into.params.push(...groups[gi].params);
  groups.splice(gi, 1);
  renderInspector(); renderPreview(); scheduleApply();
}

// Writes the layout into the recipe text (debounced); the recipe stays unsaved until Save/Test/Build.
function scheduleApply() {
  clearTimeout(uiEd.timer);
  uiEd.timer = setTimeout(async () => {
    const m = uiEd.model;
    const seq = ++uiEd.seq;
    const payload = {
      ui: m.ui,
      groups: m.groups.filter((g) => g.params.length),
      shapes: m.shapes || [],
      params: m.params,

    };
    try {
      const r = await api("/api/ui/apply", { text: $("editor").value, ui: payload });
      if (seq !== uiEd.seq) return;
      $("editor").value = r.text;
      updatePos();
      renderButtons();
      showUiError(null);
    } catch (e) {
      showUiError("Could not update the recipe: " + e.message);
    }
  }, 250);
}

function previewPoint(e) {
  const r = $("preview").getBoundingClientRect();
  const k = (uiEd.designW || r.width) / r.width; // screen pixels -> design pixels
  return [(e.clientX - r.left) * k, (e.clientY - r.top) * k, k];

  if (handle) {
    const sh = uiEd.model.shapes[handle.k];

  }

  // the cell it crosses).

  const inside = (b) => b && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h;
  const hit = under.find((h) => h.sym === uiEd.selected)
    || under.find((h) => inside(h.box))               // right on a knob, slider or switch: that control
    || under.sort((a, b) => a.w * a.h - b.w * b.h)[0];

  if (hit && hit.sym.startsWith("shape:")) {
    const sh = uiEd.model.shapes[parseInt(hit.sym.slice(6), 10)];
    drag = { shape: sh, x0: x, y0: y, start: { ...sh }, moved: false };
    $("preview").setPointerCapture(e.pointerId);

    $("preview").setPointerCapture(e.pointerId);

// Resizing and rotating a shape by its handles (see shapeHandles). Shift: 15° steps when rotating or angling a

    const [ox, oy] = h.end === 1 ? world(st.x2, st.y2) : world(st.x, st.y);

    const lx = h.sx * w / 2, ly = h.sy * hh / 2;
    const cx = h.fx + lx * cs - ly * sn, cy = h.fy + lx * sn + ly * cs;
    sh.x = r1(cx - w / 2); sh.y = r1(cy - hh / 2);
  }
}
$("preview").addEventListener("pointermove", (e) => {
  if (!drag) {
    const [x, y, kpx] = previewPoint(e);
    const h = uiEd.handles.find((hd) => Math.hypot(hd.x - x, hd.y - y) <= 7 * Math.max(1, kpx));
    $("preview").style.cursor = h ? (h.kind === "rotate" ? "grab" : "crosshair") : uiEd.model && uiEd.model.ui.layout === "free" ? "move" : "pointer";
    return;
  }
  const [x, y] = previewPoint(e);
  if (drag.handle) {
    dragHandle(drag, x, y, e.shiftKey);
    drag.moved = true;
    renderPreview();
    return;
  }
  if (drag.shape) {
    const snap = e.shiftKey ? 1 : 2;
    const dx = Math.round((x - drag.x0) / snap) * snap, dy = Math.round((y - drag.y0) / snap) * snap;
    Object.assign(drag.shape, { x: drag.start.x + dx, y: drag.start.y + dy });
    if (drag.shape.type === "line") Object.assign(drag.shape, { x2: drag.start.x2 + dx, y2: drag.start.y2 + dy });
    drag.moved = true;
    renderPreview();
    return;
  }
  if (drag.text) {
    const snap = e.shiftKey ? 1 : 2;
    uiEd.model.ui[drag.text] = [Math.max(0, Math.round((x - drag.dx) / snap) * snap), Math.max(0, Math.round((y - drag.dy) / snap) * snap)];
    drag.moved = true;
    renderPreview();
    return;
  }
  const [W, H] = freeBase();
  const [bw, bh] = freeBox(drag.p);
  const snap = e.shiftKey ? 1 : 2;
  drag.p.x = Math.max(0, Math.min(W - bw, Math.round((x - drag.dx) / snap) * snap));
  drag.p.y = Math.max(0, Math.min(H - bh, Math.round((y - drag.dy) / snap) * snap));
  drag.moved = true;
  renderPreview();
});
$("preview").addEventListener("pointerup", () => {
  if (drag && drag.moved) { renderInspector(); scheduleApply(); }
  drag = null;
});
$("pwidth").addEventListener("input", (e) => { uiEd.width = parseInt(e.target.value, 10); renderPreview(); });
for (const b of document.querySelectorAll(".tab")) b.onclick = () => showTab(b.dataset.tab);
window.addEventListener("resize", () => { if (uiEd.tab === "ui") renderPreview(); });

// the divider between the editor and the chat/output row
(function splitter() {
  const work = $("work"), bar = $("splitter");
  const saved = parseFloat(pref("split"));
  if (saved > 15 && saved < 90) work.style.setProperty("--top", saved + "%");
  bar.addEventListener("pointerdown", (e) => {
    e.preventDefault(); // no text selection while dragging
    bar.setPointerCapture(e.pointerId);
    bar.classList.add("dragging");
    document.body.style.userSelect = "none";
    const move = (ev) => {
      const r = work.getBoundingClientRect();
      const pct = Math.min(88, Math.max(25, ((ev.clientY - r.top) / r.height) * 100));
      work.style.setProperty("--top", pct + "%");
      if (uiEd.tab === "ui") renderPreview();
    };
    const up = () => {
      bar.classList.remove("dragging");
      document.body.style.userSelect = "";
      bar.removeEventListener("pointermove", move);
      bar.removeEventListener("pointerup", up);
      pref("split", parseFloat(work.style.getPropertyValue("--top")) || 62);
    };
    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", up);
  });
})();

// ---------------------------------------------------------------------------------------------------------------
// wiring

$("composer").onsubmit = (e) => {
  e.preventDefault();
  const text = $("prompt").value;
  $("prompt").value = "";
  autoGrow();
  sendMessage(text);
};
$("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("prompt").addEventListener("input", autoGrow);
$("stopAi").onclick = () => state.aiJob && api(`/api/cancel/${state.aiJob}`, {});
$("cancelBtn").onclick = () => state.toolJob && api(`/api/cancel/${state.toolJob}`, {});
$("clearChat").onclick = () => {
  if (!chat().length || confirm("Clear this conversation?")) { state.chats[chatKey()] = []; saveChats(); renderChat(); }
};
$("newBtn").onclick = newPlugin;
$("saveBtn").onclick = save;
$("testBtn").onclick = () => runTool("test");
$("buildBtn").onclick = () => runTool("build");
$("installBtn").onclick = () => runTool("install");
$("openBtn").onclick = () => runTool("open");
$("fixBtn").onclick = fixWithAi;
$("backend").onchange = () => pref("backend", $("backend").value);

const ed = $("editor");
ed.addEventListener("input", () => { updatePos(); renderButtons(); });
ed.addEventListener("click", updatePos);
ed.addEventListener("keyup", updatePos);
ed.addEventListener("keydown", (e) => {
  if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault();
    ed.setRangeText("    ", ed.selectionStart, ed.selectionEnd, "end");
    ed.dispatchEvent(new Event("input"));
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (!$("saveBtn").disabled) save(); }
});
window.addEventListener("beforeunload", (e) => { if (dirty()) e.preventDefault(); });

refresh().then(() => {
  const mine = state.recipes.filter((r) => r.source === "plugins");
  if (mine.length) selectRecipe(mine[0].id);
  else { renderChat(); renderButtons(); }
}).catch((e) => bubble("error", "Could not reach the studio server: " + escapeHtml(e.message)));
</script>
